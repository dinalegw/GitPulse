name: Playground streaming preverify

on:
  push:
    branches:
      - fix/playground-streaming-performance

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gitpulse-website/pnpm-lock.yaml
      - name: Website verification
        working-directory: gitpulse-website
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go verification
        run: |
          go vet ./...
          go test ./... -timeout 5m
          go test -race ./... -timeout 5m
          go build ./...

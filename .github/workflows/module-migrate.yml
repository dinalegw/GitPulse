name: Canonical Go Module Migration

on:
  push:
    branches:
      - hardening/canonical-module-path

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'chore: migrate Go module imports'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Rewrite module imports and metadata
        shell: bash
        run: |
          set -euo pipefail
          git grep -Il 'github.com/gitpulse/gitpulse' -- . ':!.gitpulse/activity.log' | while IFS= read -r file; do
            sed -i 's#github\.com/gitpulse/gitpulse#github.com/dinalegw/GitPulse#g' "$file"
          done
          gofmt -w $(git ls-files '*.go')
          go mod tidy

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'github.com/gitpulse/gitpulse' -- . ':!.gitpulse/activity.log'; then
            echo 'stale module path remains'
            exit 1
          fi
          go test ./...
          go vet ./...
          go build ./...

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: migrate Go module imports'
          git push

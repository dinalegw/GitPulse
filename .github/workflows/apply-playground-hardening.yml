name: Apply playground hardening

on:
  push:
    branches:
      - audit/playground-production-hardening-20260909

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/playground-production-hardening-20260909

      - name: Apply focused runtime fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sandbox_path = Path('gitpulse-website/lib/sandbox.ts')
          source = sandbox_path.read_text()

          source = source.replace(
              "const CREATE_TIMEOUT_MS = 20_000;\n",
              "const CREATE_TIMEOUT_MS = 20_000;\nconst CLEANUP_TIMEOUT_MS = 10_000;\n",
              1,
          )

          source = source.replace(
              "async function setupScratchRepo(sandbox: Sandbox): Promise<void> {",
              "async function setupScratchRepo(\n  sandbox: Sandbox,\n  command: string\n): Promise<void> {",
              1,
          )

          remote_guard = '''  if (remote !== FAKE_ORIGIN) {
            throw new Error('Scratch repository origin is not the disposable local bare repository');
          }
          '''
          baseline = '''  if (remote !== FAKE_ORIGIN) {
            throw new Error('Scratch repository origin is not the disposable local bare repository');
          }

          // Every one-shot command except init gets a valid, sandbox-local baseline
          // configuration. Without this, commands such as run/validate/doctor see
          // the global defaults (repository_path="") and fail even though the
          // disposable Git repository itself was prepared successfully.
          if (command !== 'init') {
            const configDir = `${SANDBOX_HOME}/.gitpulse`;
            const configPath = `${configDir}/config.yaml`;
            await runChecked(sandbox, 'mkdir', ['-p', configDir], { env: SAFE_ENV });

            const config = [
              'enabled: false',
              `repository_path: "${SCRATCH_DIR}"`,
              'remote_branch: "main"',
              'commits_per_day: 2',
              'dry_run: true',
              'push_remote: "origin"',
              '',
            ].join('\\n');

            await sandbox.writeFiles([
              {
                path: configPath,
                content: Buffer.from(config, 'utf8'),
              },
            ]);
          }
          '''
          if remote_guard not in source:
              raise SystemExit('sandbox remote guard insertion point not found')
          source = source.replace(remote_guard, baseline, 1)

          source = source.replace(
              "          await setupScratchRepo(sandbox!);",
              "          await setupScratchRepo(sandbox!, command);",
              1,
          )

          late_cleanup = '''      void pending
                .then((lateSandbox) => lateSandbox.delete())
                .catch((cleanupError) => {
                  console.error('[Sandbox] Late sandbox cleanup failed:', cleanupError);
                });'''
          late_cleanup_fixed = '''      void pending
                .then((lateSandbox) =>
                  withTimeout(
                    lateSandbox.delete(),
                    CLEANUP_TIMEOUT_MS,
                    'Late sandbox cleanup timed out'
                  )
                )
                .catch((cleanupError) => {
                  console.error('[Sandbox] Late sandbox cleanup failed:', cleanupError);
                });'''
          if late_cleanup not in source:
              raise SystemExit('late cleanup replacement point not found')
          source = source.replace(late_cleanup, late_cleanup_fixed, 1)

          final_cleanup = '''      try {
                await sandbox.delete();
              } catch (cleanupError) {'''
          final_cleanup_fixed = '''      try {
                await withTimeout(
                  sandbox.delete(),
                  CLEANUP_TIMEOUT_MS,
                  'Sandbox cleanup timed out'
                );
              } catch (cleanupError) {'''
          if final_cleanup not in source:
              raise SystemExit('final cleanup replacement point not found')
          source = source.replace(final_cleanup, final_cleanup_fixed, 1)
          sandbox_path.write_text(source)

          commands_path = Path('gitpulse-website/lib/commands.ts')
          commands = commands_path.read_text()
          old = "{ name: '--dry-run', description: 'Simulate initialization without writing config', type: 'boolean' },"
          new = "{ name: '--dry-run', description: 'Initialize with dry_run enabled so later runs are simulated', type: 'boolean' },"
          if old not in commands:
              raise SystemExit('init --dry-run metadata replacement point not found')
          commands_path.write_text(commands.replace(old, new, 1))

          test_path = Path('gitpulse-website/tests/playground-sandbox-baseline.test.mjs')
          test_path.write_text(r'''import { test } from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const sandbox = readFileSync(new URL('../lib/sandbox.ts', import.meta.url), 'utf8');
          const commands = readFileSync(new URL('../lib/commands.ts', import.meta.url), 'utf8');

          test('non-init playground commands receive a valid scratch-repo configuration', () => {
            assert.match(sandbox, /setupScratchRepo\([\s\S]*command: string/);
            assert.match(sandbox, /command !== 'init'/);
            assert.match(sandbox, /repository_path:/);
            assert.match(sandbox, /SCRATCH_DIR/);
            assert.match(sandbox, /dry_run: true/);
            assert.match(sandbox, /push_remote: \\"origin\\"/);
          });

          test('init remains able to initialize its own fresh config', () => {
            assert.match(sandbox, /if \(command !== 'init'\)/);
            assert.doesNotMatch(commands, /Simulate initialization without writing config/);
            assert.match(commands, /Initialize with dry_run enabled/);
          });

          test('sandbox cleanup is bounded and cannot hang the request forever', () => {
            assert.match(sandbox, /CLEANUP_TIMEOUT_MS/);
            assert.match(sandbox, /withTimeout\([\s\S]*sandbox\.delete\(\)/);
            assert.match(sandbox, /Sandbox cleanup timed out/);
            assert.match(sandbox, /Late sandbox cleanup timed out/);
          });
          ''')
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gitpulse-website/pnpm-lock.yaml

      - name: Website frozen install
        working-directory: gitpulse-website
        run: pnpm install --frozen-lockfile

      - name: Website typecheck
        working-directory: gitpulse-website
        run: pnpm run typecheck

      - name: Website lint
        working-directory: gitpulse-website
        run: pnpm run lint

      - name: Website tests
        working-directory: gitpulse-website
        run: pnpm run test

      - name: Website production build
        working-directory: gitpulse-website
        run: pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./... -timeout 5m

      - name: Go race detector
        run: go test -race ./... -timeout 5m

      - name: Go build
        run: go build ./...

      - name: Commit verified fixes and remove temporary workflow
        run: |
          git rm .github/workflows/apply-playground-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitpulse-website/lib/sandbox.ts gitpulse-website/lib/commands.ts gitpulse-website/tests/playground-sandbox-baseline.test.mjs
          git commit -m "fix: provision valid playground baseline and bound cleanup"
          git push origin HEAD:audit/playground-production-hardening-20260909

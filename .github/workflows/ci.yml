name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (unix)
        if: runner.os != 'Windows'
        run: |
          FILES="$(gofmt -l ./cmd ./internal main.go)"
          if [ -n "$FILES" ]; then
            echo "gofmt needed on:"
            echo "$FILES"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 5m

      - name: Build
        run: go build ./...

  lint:
    name: gofmt (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: pwsh
        run: |
          $f = gofmt -l ./cmd ./internal main.go
          if ($f) {
            Write-Error "gofmt needed on:`n$f"
            exit 1
          }

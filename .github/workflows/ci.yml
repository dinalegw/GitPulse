name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Migrate canonical Go module imports
        if: runner.os == 'Linux' && github.event_name == 'pull_request' && github.head_ref == 'hardening/canonical-module-path'
        shell: bash
        run: |
          set -euo pipefail
          git grep -Il 'github.com/gitpulse/gitpulse' -- . ':!.gitpulse/activity.log' | while IFS= read -r file; do
            sed -i 's#github\.com/gitpulse/gitpulse#github.com/dinalegw/GitPulse#g' "$file"
          done
          gofmt -w $(git ls-files '*.go')
          go mod tidy
          if git diff --quiet; then
            echo 'No module migration changes required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'chore: migrate Go module imports'
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate Unix scripts
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/build.sh
          bash -n scripts/install.sh
          bash -n scripts/test.sh
          bash -n scripts/bootstrap.sh

      - name: Validate PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/bootstrap.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: gofmt (unix)
        if: runner.os != 'Windows'
        run: |
          FILES="$(gofmt -l ./cmd ./internal main.go)"
          if [ -n "$FILES" ]; then
            echo "gofmt needed on:"
            echo "$FILES"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 5m

      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race ./... -timeout 5m

      - name: Build
        run: go build ./...

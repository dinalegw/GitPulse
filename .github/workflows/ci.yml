name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate Unix scripts
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/build.sh
          bash -n scripts/install.sh
          bash -n scripts/test.sh
          bash -n scripts/bootstrap.sh

      - name: Validate PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/bootstrap.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: gofmt (unix)
        if: runner.os != 'Windows'
        run: |
          FILES="$(gofmt -l ./cmd ./internal main.go)"
          if [ -n "$FILES" ]; then
            echo "gofmt needed on:"
            echo "$FILES"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 5m

      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race ./... -timeout 5m

      - name: Build
        run: go build ./...

      - name: Verify external go install
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          VERIFY_BIN="$VERIFY_DIR/bin"
          mkdir -p "$VERIFY_BIN"
          cd "$VERIFY_DIR"
          GOBIN="$VERIFY_BIN" go install "github.com/dinalegw/GitPulse@${{ github.event.pull_request.head.sha || github.sha }}"
          INSTALLED_BIN="$(find "$VERIFY_BIN" -maxdepth 1 -type f -perm -u+x -print -quit)"
          if [ -z "$INSTALLED_BIN" ]; then
            echo "go install completed but no executable was produced in $VERIFY_BIN"
            ls -la "$VERIFY_BIN"
            exit 1
          fi
          echo "Installed executable: $INSTALLED_BIN"
          "$INSTALLED_BIN" version

      - name: Bootstrap smoke test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$(mktemp -d)"
          export GITPULSE_INSTALL_ROOT="$TEST_ROOT/toolchain"
          export PREFIX="$TEST_ROOT/bin"
          ./scripts/bootstrap.sh
          ./scripts/bootstrap.sh
          "$PREFIX/gitpulse" version

      - name: Bootstrap smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'gitpulse-bootstrap-test'
          $env:GITPULSE_INSTALL_ROOT = Join-Path $testRoot 'toolchain'
          $env:PREFIX = Join-Path $testRoot 'bin'
          & "$PWD\scripts\bootstrap.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$PWD\scripts\bootstrap.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:PREFIX 'gitpulse.exe') version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  website:
    name: Website (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        working-directory: gitpulse-website
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: gitpulse-website
        run: npm run typecheck

      - name: Lint
        working-directory: gitpulse-website
        run: npm run lint

      - name: Test
        working-directory: gitpulse-website
        run: npm run test

      - name: Build
        working-directory: gitpulse-website
        env:
          E2B_API_KEY: dummy_for_build
        run: npm run build
